# nav2_params.yaml
# Nav2 configuration for Pioneer 3-AT – Part 3
#
# Robot: Pioneer 3-AT, differential drive, ~0.5m wide, outdoor grass/sand
# Sensors: Lakibeam lidar → /scan, wheel odometry → /odom, slam_toolbox → /map
#
# Key choices:
#   Controller:   RegulatedPurePursuitController – works well for outdoor
#                 waypoint following on a differential drive robot.  More
#                 stable than DWB on uneven terrain.
#   Planner:      NavFn (Dijkstra/A*) – straightforward global planner,
#                 reliable on the 15x15m costmap size we're using.
#   Localisation: Provided by slam_toolbox (NOT amcl).  slam_toolbox runs
#                 online_async and publishes both /map and odom→map TF.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: 'nav2_bt_navigator::NavigateToPoseNavigator'
    navigate_through_poses:
      plugin: 'nav2_bt_navigator::NavigateThroughPosesNavigator'
    error_code_names: ['follow_path_error_code', 'compute_path_error_code']

controller_server:
  ros__parameters:
    use_sim_time: true
    cmd_vel_topic: /cmd_vel
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ['progress_checker']
    goal_checker_plugins: ['general_goal_checker']
    controller_plugins: ['FollowPath']
    current_goal_checker: general_goal_checker
    current_progress_checker: progress_checker

    progress_checker:
      plugin: 'nav2_controller::SimpleProgressChecker'
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: 'nav2_controller::SimpleGoalChecker'
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.5   # radians – loose; orientation matters less outdoors
      stateful: true

    FollowPath:
      plugin: 'dwb_core::DWBLocalPlanner'
      # DWB (Dynamic Window B) scores candidate velocity commands against
      # several critics and picks the best one each control cycle.
      # Good for dynamic environments and differential-drive robots.
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.25         # m/s — slower = better odometry integration = less SLAM drift
      max_vel_y: 0.0
      max_vel_theta: 0.4      # rad/s — slower turns reduce heading error
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.0
      decel_lim_x: -2.0
      decel_lim_y: 0.0
      decel_lim_theta: -3.0
      vx_samples: 20          # velocity samples in x – more = better but slower
      vy_samples: 1           # y samples = 1 for differential drive
      vtheta_samples: 20
      sim_time: 1.5           # seconds to simulate each candidate trajectory
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      critics: ['RotateToGoal', 'Oscillation', 'BaseObstacle',
                'GoalAlign', 'PathAlign', 'PathDist', 'GoalDist']
      # Critic weights – tuned for outdoor waypoint navigation
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ['GridBased']
    GridBased:
      plugin: 'nav2_navfn_planner::NavfnPlanner'
      tolerance: 0.5
      use_astar: true     # A* is faster than Dijkstra for directional nav
      allow_unknown: true # allows planning through unexplored areas during mapping

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 3.0
    behavior_plugins: ['spin', 'backup', 'drive_on_heading', 'wait']
    spin:
      plugin: 'nav2_behaviors::Spin'
    backup:
      plugin: 'nav2_behaviors::BackUp'
    drive_on_heading:
      plugin: 'nav2_behaviors::DriveOnHeading'
    wait:
      plugin: 'nav2_behaviors::Wait'

waypoint_task_executor:
  ros__parameters:
    use_sim_time: true
    waypoint_task_executor_plugin: 'wait_at_waypoint'
    wait_at_waypoint:
      plugin: 'nav2_waypoint_follower::WaitAtWaypoint'
      enabled: true
      waypoint_pause_duration: 0   # no pausing – drive through as fast as possible

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: 'OPEN_LOOP'
    max_velocity: [0.5, 0.0, 0.8]    # [linear_x, linear_y, angular_z]
    min_velocity: [-0.5, 0.0, -0.8]
    max_accel: [2.0, 0.0, 3.0]
    max_decel: [-2.0, 0.0, -3.0]
    odom_topic: 'odom'
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6          # metres – 6m window is enough for local avoidance
      height: 6
      resolution: 0.05  # 5 cm per cell
      # Pioneer 3-AT footprint (approximate rectangular footprint in metres)
      # The actual robot is about 0.49m wide x 0.51m long
      footprint: '[[0.26, 0.25], [0.26, -0.25], [-0.26, -0.25], [-0.26, 0.25]]'
      plugins: ['obstacle_layer', 'inflation_layer']
      obstacle_layer:
        plugin: 'nav2_costmap_2d::ObstacleLayer'
        enabled: true
        observation_sources: lakibeam_scan
        lakibeam_scan:
          topic: /scan           # Lakibeam publishes LaserScan on /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: 'LaserScan'
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: 'nav2_costmap_2d::InflationLayer'
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      track_unknown_space: true
      resolution: 0.05
      rolling_window: true
      width: 20
      height: 20
      footprint: '[[0.26, 0.25], [0.26, -0.25], [-0.26, -0.25], [-0.26, 0.25]]'
      plugins: ['static_layer', 'obstacle_layer', 'inflation_layer']
      static_layer:
        plugin: 'nav2_costmap_2d::StaticLayer'
        map_subscribe_transient_local: false
        enabled: true
      obstacle_layer:
        plugin: 'nav2_costmap_2d::ObstacleLayer'
        enabled: true
        observation_sources: lakibeam_scan
        lakibeam_scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: 'LaserScan'
          raytrace_max_range: 10.0
          obstacle_max_range: 8.0
      inflation_layer:
        plugin: 'nav2_costmap_2d::InflationLayer'
        cost_scaling_factor: 3.0
        inflation_radius: 0.6

docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: []
    dock_database: ''
    navigator_bt_node: ''

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_nav
    transform_tolerance: 0.5
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    polygons: ['PolygonStop']
    PolygonStop:
      type: 'circle'
      radius: 0.3
      action_type: 'stop'
      max_points: 3
      visualize: false
    observation_sources: ['scan']
    scan:
      type: 'scan'
      topic: /scan
      min_height: 0.1
      max_height: 2.0
      enabled: true

# Lifecycle manager starts all Nav2 nodes in the right order and monitors them.
# If any node crashes, lifecycle_manager can attempt a restart.
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - 'controller_server'
      - 'planner_server'
      - 'behavior_server'
      - 'bt_navigator'
      - 'waypoint_follower'
