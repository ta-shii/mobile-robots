# slam_toolbox params for SIMULATION
# Based on the official mapper_params_online_async.yaml reference config,
# with values tuned for Pioneer 3-AT in the 15x15 m sim arena.
slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Solver — Ceres gives better global optimisation than the default
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames — must match our TF tree
    odom_frame: odom
    map_frame: map
    base_frame: base_link          # Pioneer uses base_link, NOT base_footprint
    scan_topic: /scan

    mode: mapping

    # TF / timing
    transform_publish_period: 0.05  # 20 Hz TF publish rate
    transform_timeout: 0.2          # how long to wait for a TF before giving up
    tf_buffer_duration: 30.0        # how much TF history to keep

    # Map
    resolution: 0.05                # 5 cm per cell
    map_update_interval: 2.0        # seconds between map publishes (5.0 is too slow for Nav2 costmap)
    throttle_scans: 1               # process every scan
    restamp_tf: true                # stamp TF with current time — prevents "transform too old"
                                    # errors when Ceres solver adds processing lag between scans
    stack_size_to_use: 40000000     # needed for large map serialisation

    # Laser
    min_laser_range: 0.0
    max_laser_range: 10.0           # Lakibeam max range

    # Scan processing frequency
    # Lower than reference (0.5) so we get more frequent map updates.
    # Helps with Nav2 costmap staying current at slow robot speed.
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.1   # process a scan after robot moves 0.1 m
    minimum_travel_heading: 0.1    # or rotates 0.1 rad
    check_min_dist_and_heading_precisely: false

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 10                    # number of recent scans used for matching
    scan_buffer_maximum_scan_distance: 10.0 # ignore scans taken from > 10 m away
    link_match_minimum_response_fine: 0.1   # minimum match quality to link two scans
    link_scan_maximum_distance: 1.5         # only link scans taken within 1.5 m of each other

    # Correlation search space (local scan-to-scan matching window)
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_match_maximum_variance_fine: 0.1

    # Scan matcher penalty / fine search parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # Occupancy grid
    min_pass_through: 2       # a cell needs 2 laser passes to be marked free
    occupancy_threshold: 0.1  # probability threshold for occupied vs free
