# slam_toolbox params for SIMULATION
slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    transform_publish_period: 0.05
    resolution: 0.05
    max_laser_range: 10.0
    minimum_time_interval: 0.2    # process scans more frequently (was 0.5)

    # Scan matching — tighter tolerances to reduce drift
    minimum_travel_distance: 0.1  # process a scan after robot moves 0.1 m
    minimum_travel_heading: 0.1   # or rotates 0.1 rad

    # Loop closure — snaps drift when robot revisits an area
    do_loop_closing: true
    loop_search_space_dimension: 8.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_search_maximum_distance: 3.0
    loop_match_maximum_variance_fine: 0.1
